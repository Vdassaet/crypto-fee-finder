version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainrecover-ai-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chainrecover_db?schema=public
      - JWT_SECRET=chainrecover_ai_super_secret_jwt_key_2026
      - ENCRYPTION_SECRET=chainrecover_ai_encryption_key_32_bytes_long!
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: chainrecover-ai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chainrecover_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
